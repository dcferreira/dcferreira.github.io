{{/* Embed a self-contained HTML figure from static/ and size the iframe to its content (same origin). */}}
<figure class="figframe" style="margin: 1.5rem 0">
  <iframe src="{{ .Get "src" | relURL }}?v={{ now.Unix }}" title="{{ .Get "title" }}" loading="lazy" scrolling="no"
    style="width: 100%; border: 0; display: block; height: {{ .Get "height" | default "420" }}px"
    allowtransparency="true"
    onload="(function (f) { function theme() { var t = document.body.classList.contains('dark') ? 'dark' : 'light'; f.style.colorScheme = t; try { f.contentDocument.documentElement.dataset.theme = t; } catch (e) {} } theme(); new MutationObserver(theme).observe(document.body, { attributes: true, attributeFilter: ['class'] }); function fit() { try { f.style.height = Math.ceil(f.contentDocument.body.getBoundingClientRect().height) + 'px'; } catch (e) {} } fit(); try { new ResizeObserver(fit).observe(f.contentDocument.body); } catch (e) {} })(this)"></iframe>
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
