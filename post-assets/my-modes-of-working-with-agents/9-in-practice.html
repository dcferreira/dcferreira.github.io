<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>In practice: all three at once</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three alternative treatments stacked, each a row of the three stages. Same visual language as the "How I use agents" figures: pink "me", dark agent windows, squiggles for text, blue = steering (how), amber = goals (what) */
:root{
  --bg:#eef1f4; --surface:#fbfcfd; --fg:#16202b; --muted:#5a6878; --line:#c9d1da; --ink:#8b97a5;
  --you:#b8396b; --talk:#4d5b6c; --p1:#5a6878; --p2:#2f6fd0; --p3:#1f8a70; --p4:#a87a12; --p5:#8a4fc8; --proj-fo:.07; --proj-so:.35; --work:#2f6fd0; --plan:#a87a12;
  --term-bg:#121820; --term-bar:#222d39; --term-fg:#d5dde5; --term-dim:#5f6d7b; --term-work:#6aa2f2; --term-plan:#e2b65a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#151d26; --fg:#e4eaf0; --muted:#93a2b2; --line:#2a3846; --ink:#6d7c8c;
  --you:#e8739f; --talk:#a3b0bf; --p1:#93a2b2; --p2:#6aa2f2; --p3:#4cc39f; --p4:#d8b25a; --p5:#b98af0; --proj-fo:.11; --proj-so:.4; --work:#6aa2f2; --plan:#d8b25a; --term-bg:#06090d; --term-bar:#1e2834;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#151d26; --fg:#e4eaf0; --muted:#93a2b2; --line:#2a3846; --ink:#6d7c8c;
  --you:#e8739f; --talk:#a3b0bf; --p1:#93a2b2; --p2:#6aa2f2; --p3:#4cc39f; --p4:#d8b25a; --p5:#b98af0; --proj-fo:.11; --proj-so:.4; --work:#6aa2f2; --plan:#d8b25a; --term-bg:#06090d; --term-bar:#1e2834;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:36px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:44px}
header{display:grid;gap:8px}
.draft{font:12px var(--mono);color:var(--plan);margin:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.legend svg{flex:none}

.alt{display:grid;gap:16px}
.alt-head{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline}
.letter{font:700 13px/1 var(--mono);color:var(--surface);background:var(--fg);border-radius:6px;padding:5px 8px;grid-row:span 2;align-self:start}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;margin:0}
.alt-head p{margin:2px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;grid-column:2}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.row{grid-template-columns:minmax(0,1fr);max-width:420px}}
figure{margin:0;display:grid;gap:8px;align-content:start;min-width:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:6px}
svg.d{width:100%;height:auto;display:block}
figcaption{margin:0;font-size:14px;color:var(--muted)}
figcaption b{color:var(--fg);font-weight:600}
.snum{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-right:2px}

/* SVG parts */
.me-ico{color:var(--you)}
.win-bg{fill:var(--term-bg)}
.win-bar{fill:var(--term-bar)}
.win-dot{fill:var(--term-dim)}
.win-ttl{fill:var(--term-fg);font:500 7.5px var(--mono)}
.win.faded{opacity:.35}
.sq{fill:none;stroke-width:1.6;stroke-linecap:round}
.sq.how{stroke:var(--term-work)}
.sq.reply{stroke:var(--term-dim)}
.sq.what{stroke:var(--term-plan)}
.chk{fill:none;stroke:var(--term-plan);stroke-width:1.1}
.monitor{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.stand{fill:var(--line)}
.ln{fill:none;stroke-linecap:round}
.ln.how{stroke:var(--work);stroke-width:2}
.ln.what{stroke:var(--plan);stroke-width:2;stroke-dasharray:5 4}
.ln.me{stroke:var(--you);stroke-width:1.6}
.ln.talk{stroke:var(--you);stroke-width:2}
.hd-talk{fill:var(--you)}
.band{fill:color-mix(in srgb,var(--line) 28%,transparent);stroke:none}
.blbl{fill:var(--muted);font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.empty{fill:var(--muted);font:italic 400 9.5px var(--body);opacity:.8}
.lit{fill:none;stroke:var(--you);stroke-width:2}
.talk path{fill:none;stroke:var(--talk);stroke-width:1.8;stroke-linecap:round}
.talk circle{fill:var(--talk)}
.talk.faded-ln{opacity:.35}
.org{fill:none;stroke:var(--talk);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.me-lbl{fill:var(--you);font:700 13px var(--display)}
.proj{fill-opacity:var(--proj-fo);stroke-opacity:var(--proj-so);stroke-width:1.2}
.proj.p1{fill:var(--p1);stroke:var(--p1)} .gname.p1{fill:var(--p1)}
.proj.p2{fill:var(--p2);stroke:var(--p2)} .gname.p2{fill:var(--p2)}
.proj.p3{fill:var(--p3);stroke:var(--p3)} .gname.p3{fill:var(--p3)}
.proj.p4{fill:var(--p4);stroke:var(--p4)} .gname.p4{fill:var(--p4)}
.proj.p5{fill:var(--p5);stroke:var(--p5)} .gname.p5{fill:var(--p5)}
.anims{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:20px}
.anim .stage{padding:0}
.anim iframe{display:block;width:100%;border:0}
.alt-head code{font:13px var(--mono)}
.grp{fill:none;stroke:var(--line);stroke-width:1.5}
.glbl{fill:var(--fg);font:600 11px var(--body)}
.gmode{fill:var(--muted);font-weight:400}
.wide{overflow-x:auto}
svg.big{min-width:760px}
.ln.agent{stroke:var(--ink);stroke-width:1.2}
.hd-how{fill:var(--work)} .hd-what{fill:var(--plan)}
.zone{stroke-width:1.2}
.zone.how{fill:color-mix(in srgb,var(--work) 12%,transparent);stroke:color-mix(in srgb,var(--work) 55%,transparent)}
.zone.what{fill:color-mix(in srgb,var(--plan) 14%,transparent);stroke:color-mix(in srgb,var(--plan) 60%,transparent)}
.zlbl{font:600 10px var(--body)}
.zlbl.how{fill:var(--work)} .zlbl.what{fill:var(--plan)}
.curtain{fill:var(--bg);stroke:var(--line);stroke-dasharray:4 4}
.sight{fill:var(--muted);font:italic 500 9.5px var(--body)}
</style>
<style>
/* embedded in the blog post: no card, no heading, the post's background shows through */
html,body{background:transparent}
body{margin:0}
.fig9{padding:4px 0 8px}
.fig9 svg{display:block;width:100%;height:auto}
</style></head><body>
