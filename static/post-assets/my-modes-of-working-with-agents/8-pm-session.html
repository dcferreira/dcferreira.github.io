<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talking to the PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same visual language as the first post: squiggles for text, dark terminal windows for agents, pink for me */
:root{
  --bg:#eef1f4; --surface:#fbfcfd; --fg:#16202b; --muted:#5a6878; --line:#c9d1da; --ink:#8b97a5;
  --you:#b8396b; --work:#2f6fd0; --plan:#8a6a1c;
  --term-bg:#121820; --term-bar:#222d39; --term-fg:#d5dde5; --term-dim:#5f6d7b; --term-ok:#6cc596; --term-acc:#e8739f; --bell:#e0a42a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#151d26; --fg:#e4eaf0; --muted:#93a2b2; --line:#2a3846; --ink:#6d7c8c;
  --you:#e8739f; --work:#6aa2f2; --plan:#d8b25a; --term-bg:#04070a; --term-bar:#141c25;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#151d26; --fg:#e4eaf0; --muted:#93a2b2; --line:#2a3846; --ink:#6d7c8c;
  --you:#e8739f; --work:#6aa2f2; --plan:#d8b25a; --term-bg:#04070a; --term-bar:#141c25;
  color-scheme:dark}
/* embedded in the blog post: no card around the stage, the post's background shows through */
html,body{background:transparent}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.fig{padding:8px 16px;display:grid;gap:8px;max-width:440px;margin:0 auto}
.stage{position:relative;height:500px}
.scene{position:absolute;inset:5px;animation:fadein .35s ease-out both}
.replay{justify-self:end;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:0}
@keyframes fadein{from{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@keyframes popin{from{transform:scale(.5);opacity:0}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--you) 50%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* agent windows */
.win{background:var(--term-bg);border-radius:7px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.18);min-width:0}
.tb{display:flex;gap:4px;align-items:center;padding:5px 8px;background:var(--term-bar);font:10.5px/1.3 var(--mono);color:var(--term-dim);flex:none;white-space:nowrap}
.tb i{width:6px;height:6px;border-radius:50%;background:var(--term-dim);flex:none}
.tb span{margin-left:4px;overflow:hidden;text-overflow:ellipsis;color:var(--term-fg)}
.tb b{margin-left:auto;font-weight:600;color:var(--term-fg)}
.win .body{flex:1;padding:6px 8px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.win .body svg{width:100%;height:8px;overflow:visible;flex:none}
.sq{fill:none;stroke-linecap:round}
.win .sq{stroke:var(--term-fg);stroke-width:1.8;stroke-dasharray:100;stroke-dashoffset:100;animation:work 2.6s ease-in-out infinite}
@keyframes work{0%{stroke-dashoffset:100;opacity:1}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.win .cur{width:6px;height:9px;background:var(--term-ok);animation:pulse 1s steps(1) infinite;flex:none}
.win.new{animation:popin .4s ease-out both}

/* the prompt box (a claude session I type into) */
.cc{width:100%;background:var(--term-bg);border-radius:9px;overflow:hidden;text-align:left;border:0;padding:0;display:block;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.cc .pr{display:block;padding:9px 10px 11px;font:12px/1.55 var(--mono);color:var(--term-acc);overflow-wrap:anywhere}
.cc .pr::before{content:"> ";color:var(--term-dim)}
.cc .caret{display:inline-block;width:7px;height:13px;background:var(--term-fg);vertical-align:-2px;animation:pulse 1s steps(1) infinite}
.cc .sent{display:block;color:var(--term-ok);margin-top:4px}
.cc .sent::before{content:"⏺ "}
.turn{display:flex;justify-content:flex-end;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted)}
.enter{background:var(--surface);color:var(--you);border:1.5px solid var(--you);border-bottom-width:4px;border-radius:9px;padding:5px 14px;font:600 14px var(--mono);cursor:pointer;animation:fadein .3s ease-out both,bob 1.2s ease-in-out .5s infinite,ring 1.6s ease-out .5s infinite}
.enter:active{border-bottom-width:1.5px;transform:translateY(2px)}
.stack{display:grid;gap:10px;align-content:start;height:100%}
.spawn{display:grid;gap:8px}
.spawn .win{height:var(--wh,78px)}
.who{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.pm{height:100%;background:var(--term-bg);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pm .log{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;padding:8px 12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--term-dim) transparent;scroll-behavior:smooth;font:11.5px/1.4 var(--mono);color:var(--term-fg)}
.ln{animation:fadein .3s ease-out both;overflow-wrap:anywhere}
.ln b{font-weight:500;color:var(--term-fg)}
.ln.st{color:var(--term-dim)} .ln.st::before{content:"⏺ ";color:var(--term-ok)}
.ln.st b{color:var(--term-fg)}
.ln.dim::before{color:var(--term-dim)}
.ln.rep::before{content:"⏺ ";color:var(--term-fg)}
.ln.me{color:var(--term-acc)} .ln.me::before{content:"> ";color:var(--term-dim)}
.ln.q{border-left:3px solid var(--bell);background:color-mix(in srgb,var(--bell) 16%,transparent);padding:5px 8px;border-radius:0 6px 6px 0;color:var(--term-fg)}
.ln.q::before{content:"needs you · ";color:var(--bell);font-weight:500}
.ln.q b{color:var(--term-fg)}
.ln.gap{text-align:center;color:var(--term-dim);font-size:11px;letter-spacing:.08em}
.ln.gap::before,.ln.gap::after{content:" · · · "}
.pm .in{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--term-bar);cursor:pointer}
.pm .in .pr{flex:1;min-width:0;font:12px/1.5 var(--mono);color:var(--term-acc);overflow-wrap:anywhere;min-height:18px}
.pm .in .pr::before{content:"> ";color:var(--term-dim)}
.pm .caret{display:inline-block;width:7px;height:13px;background:var(--term-fg);vertical-align:-2px;animation:pulse 1s steps(1) infinite}
.pm .log>:first-child{margin-top:auto}
.pm .enter{flex:none}
.ln.rv ol{margin:4px 0 0;padding-left:20px}
.ln.rv li{margin:1px 0}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body>
<div class="fig"><div class="stage" id="stage" aria-live="polite"></div><button class="replay" id="replay" type="button">↻ replay</button></div>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
let ts=[];
const at=(ms,fn)=>ts.push(setTimeout(fn,reduce?0:ms));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function wave(w,amp=3,per=12,y=6){let d=`M0 ${y}`,s=1; for(let x=0;x<w-0.1;x+=per/2){const nx=Math.min(w,x+per/2); d+=` Q${(x+nx)/2} ${y-amp*s} ${nx} ${y}`; s=-s} return d}
function win(label,i=0,n=3,cls='',num=''){
  const lines=[...Array(n)].map((_,j)=>`<svg viewBox="0 0 100 8" preserveAspectRatio="none"><path class="sq" d="${wave(100*(.55+((i+j)%3)*.15),2.2,9,4)}" pathLength="100" vector-effect="non-scaling-stroke" style="animation-delay:${(i*.45+j*.8).toFixed(2)}s"/></svg>`).join('');
  return `<div class="win ${cls}"><span class="tb"><i></i><i></i><i></i><span>${label}</span>${num?`<b>${num}</b>`:''}</span><div class="body">${lines}<span class="cur"></span></div></div>`;
}
/* A prompt typed into a session; Enter appears; pressing it (or tapping the box) spawns the windows. */
function promptScene({session,cmd,sent,spawn,cols,wh,lines=3,after}){
  let busy=false;
  stage.innerHTML=`<div class="scene stack"><button class="cc" type="button" aria-label="Send the prompt"><span class="tb"><i></i><i></i><i></i><span>${session}</span></span><span class="pr"><span class="caret"></span></span></button>
    <div class="turn"><span class="hint">your turn</span><button class="enter" type="button" hidden>⏎ click to send</button></div>
    <div class="spawn" style="grid-template-columns:repeat(${cols},minmax(0,1fr));--wh:${wh}px"></div></div>`;
  const pr=stage.querySelector('.pr'), en=stage.querySelector('.enter'), sp=stage.querySelector('.spawn'), turn=stage.querySelector('.turn');
  const send=()=>{ if(busy) return; busy=true; turn.remove();
    pr.innerHTML=`${esc(cmd)}<span class="sent">${sent}</span>`;
    at(500,()=>{ sp.innerHTML=spawn.map((s,i)=>win(s,i,lines,'new')).join('');
      [...sp.children].forEach((w,i)=>w.style.animationDelay=(i*.15)+'s'); after&&after(sp); });
  };
  stage.querySelector('.cc').onclick=()=>{ if(en.hidden) return; send() };
  en.onclick=send;
  let n=0; const step=()=>{ if(busy) return; pr.innerHTML=esc(cmd.slice(0,n))+'<span class="caret"></span>'; if(n<cmd.length){n+=2; at(28,step)} else en.hidden=false }; step();
}
const SCENE=function(){
    const S=[
      ['say',[['<b>rota-calendar</b> (worker): in progress','st'],['<b>stock-levels</b> (worker): in progress','st'],['<b>tech lead</b>: reviewing the plan for supplier reorders','st']]],
      ['say',[['Can part-timers swap shifts with each other, or only with full-timers? The tech lead needs this to model the rota.','q']]],
      ['type','Anyone can swap with anyone.'],
      ['say',[['Thanks. Passed to the tech lead: any shift can be swapped. <b>rota-calendar</b> is unblocked.','rep'],['<b>rota-calendar</b> (worker): in progress','st']]],
      ['say',[['3 hours later','gap']]],
      ['say',[['Ready for your review, let me know when you’re done:<ol><li><b>#12</b> rota: shift calendar</li><li><b>#13</b> rota: shift swaps</li><li><b>#14</b> stock: ingredient levels</li></ol>','q rv']]],
      ['type','Reviewed. 1 and 2 look great, merged. 3: the flour counts in kg but the supplier sells by the 25 kg sack, so show sacks.'],
      ['say',[['Got it. Sent <b>#14</b> back to its worker with your note.','rep']]],
    ];
    stage.innerHTML=`<div class="scene"><div class="pm"><span class="tb"><i></i><i></i><i></i><span>PM · staff tool</span></span>
      <div class="log"></div><div class="in"><span class="pr"></span><button class="enter" type="button" hidden>⏎ click to send</button></div></div></div>`;
    const log=stage.querySelector('.log'), pr=stage.querySelector('.in .pr'), en=stage.querySelector('.enter'), inp=stage.querySelector('.in');
    const say=(html,cls)=>{ const d=document.createElement('div'); d.className='ln '+cls; d.innerHTML=html; log.appendChild(d); log.scrollTop=log.scrollHeight; };
    pr.innerHTML='<span class="caret"></span>';
    let k=0;
    const run=()=>{ if(k>=S.length) return; const [kind,x]=S[k++];
      if(kind==='say'){ x.forEach((l,i)=>at(i*800,()=>say(...l))); at(x.length*800+(S[k]&&S[k][0]==='say'?400:300),run); return; }
      let n=0, busy=false;
      const send=()=>{ if(busy) return; busy=true; en.hidden=true; inp.onclick=null; pr.innerHTML='<span class="caret"></span>'; say(esc(x),'me'); at(700,run); };
      const step=()=>{ if(busy) return; pr.innerHTML=esc(x.slice(0,n))+'<span class="caret"></span>'; if(n<x.length){n+=2; at(28,step)} else { en.hidden=false; en.onclick=send; inp.onclick=e=>{ if(e.target!==en) send() } } };
      at(600,step);
    };
    at(400,run);
  };
function play(){ts.forEach(clearTimeout); ts=[]; SCENE()}
document.getElementById('replay').onclick=play;
const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){play(); io.disconnect()}},{threshold:.4});
io.observe(stage);
</script></body></html>
